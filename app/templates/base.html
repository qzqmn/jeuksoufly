<!doctype html><html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}著數飛|香港人外遊・北上優惠與機票降價提醒{% endblock %}</title>
<meta name="description" content="著數飛:追蹤機票降價、快閃優惠、Klook/Trip.com Promo Code 與信用卡外遊回贈,Telegram 即時提醒。">
<style>
:root{--bg:#f6f7fb;--fg:#1c2230;--mut:#6b7385;--card:#fff;--bd:#e4e7ef;--pri:#ff5a36;--pri2:#ffb020;--ok:#0f9d58}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--fg:#e8ebf3;--mut:#9aa3b8;--card:#171b25;--bd:#262c3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:16px;height:56px}
.logo{font-weight:800;font-size:20px;color:var(--pri)}nav{display:flex;gap:14px;font-size:15px;color:var(--mut);overflow-x:auto;white-space:nowrap}
nav a:hover,nav a.on{color:var(--fg)}.sp{flex:1}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.hero{padding:28px 0 8px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 12px;font-size:14px;color:var(--mut)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:17px}.mut{color:var(--mut);font-size:14px}.price{color:var(--pri);font-weight:800;font-size:20px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--pri2);color:#2b1d00;margin-right:6px}
.lock{opacity:.8;border-style:dashed}table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
input,select,textarea{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:15px;max-width:100%}
footer{color:var(--mut);font-size:13px;padding:28px 0 40px}.bar{display:flex;align-items:flex-end;gap:3px;height:70px}.bar i{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:13px}
.bad{color:#d93025}.good{color:var(--ok)}.tabs a{margin-right:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><div class="wrap"><a class="logo" href="/">✈️ 著數飛</a>
<nav><a href="/">優惠</a><a href="/flights">機票</a><a href="/cards">回贈計算機</a><a href="/vip">VIP</a></nav><span class="sp"></span>
{% if C.BOT_USERNAME %}<a class="btn" href="https://t.me/{{C.BOT_USERNAME}}">Telegram 訂閱</a>{% endif %}</div></header>
<main class="wrap">{% if get_setting("site_notice") %}<div class="card" style="margin-top:12px">📢 {{ get_setting("site_notice") }}</div>{% endif %}{% block body %}{% endblock %}
<footer><a href="/privacy" style="text-decoration:underline">私隱政策</a> · <a href="/terms" style="text-decoration:underline">使用條款</a> · <a href="/vip/manage" style="text-decoration:underline">管理訂閱</a><br>聯盟披露:本站部分連結為聯盟(Affiliate)連結,你經此購買或申請,本站可能獲得佣金,不影響你的價格。優惠、價格及信用卡回贈以商戶及銀行官方最新資料為準,本站資料僅供參考,不構成財務建議。</footer></main></body></html>
